# Claims app pipeline: every PR is tested and smoke-tested as a hardened container; pushes to main
# (or a manual run) publish the image to ACR and deploy it to AKS through the "aks-demo" environment.
name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/dotnet-container-build.yml
    permissions:
      contents: read
      id-token: write
    with:
      image-name: claims
      solution: Claims.slnx
      smoke-command: python3 tests/smoke.py "$APP_URL"
      publish: ${{ github.event_name != 'pull_request' && vars.ACR_NAME != '' }}
      environment: aks-demo
      registry-name: ${{ vars.ACR_NAME }}
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

  deploy:
    if: github.event_name != 'pull_request' && vars.ACR_NAME != ''
    needs: build
    uses: ./.github/workflows/aks-deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: aks-demo
      azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
      azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
      azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
      cluster-name: ${{ vars.AKS_CLUSTER }}
      namespace: claims
      manifests: deploy/k8s/app.yaml deploy/k8s/gateway.yaml
      manifest-vars: |
        IMAGE=${{ needs.build.outputs.image }}
        DNS_LABEL=${{ vars.DNS_LABEL }}
        APP_HOST=${{ vars.APP_HOST }}
        ACME_SERVER=https://acme-v02.api.letsencrypt.org/directory
      rollout: deployment/claims
      wait-gateways: true
      wait-certificates: true
      app-url: https://${{ vars.APP_HOST }}
      ready-path: /version
      ready-text: ${{ needs.build.outputs.release }}
      smoke-command: python3 tests/smoke.py "$APP_URL"
